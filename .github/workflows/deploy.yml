name: deploy
on:
  pull_request:
  push:
    branches:
      - main
  # workflow_dispatch: # 添加手动触发
    
permissions:
  contents: write
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run setup
      - run: npm test
      - run: npm run generate
      - name: Check committed generated files
        run: |
          git diff --exit-code
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short
            echo 'Generated course pages/navigation are not committed. Run npm run generate locally.'
            exit 1
          fi
      - run: npm run build
      - name: Deploy verified site
        if: github.event_name == 'push'
        run: .venv/bin/python -m mkdocs gh-deploy --force
